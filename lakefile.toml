name = "ShipYourTcc"
defaultTargets = ["CCLib", "Clightdefs", "Tcc", "Vsa", "TccMachine", "ClightRun"]

# Certora/clean's Lean Clight (export/ @123f7f7, LGPL-2.1+), patched by
# patches/certora/0002-cclib-extsem-param.patch. The directory is generated by
# scripts/cclib_src.sh from the pristine vendor/certora-export; check.sh
# regenerates it and fails on any difference.
[[lean_lib]]
name = "CCLib"
srcDir = "vendor/certora-export-patched"

[[lean_lib]]
name = "Clightdefs"
srcDir = "vendor/certora-export-patched"

# Phase 3: printf, the run machinery, per-program Clight facts.
[[lean_lib]]
name = "Tcc"

# Phase 2 oracle `lean_clight`: Certora's interpreter `doStep` on clightgen
# output, with printf from Tcc.Clight.format (scripts/run_lean_clight.sh).
# The executable is built on demand: `lake build clight_run`.
[[lean_lib]]
name = "ClightRun"
srcDir = "lean/ClightRun"
roots = ["ClightRun.Run"]

[[lean_exe]]
name = "clight_run"
srcDir = "lean/ClightRun"
root = "Main"
supportInterpreter = true

# --- Machine lane (Phase 3a, the captured cut) -------------------------------
# The Sail RISC-V model and its emulator, copied from ship-your-lua's
# riscv-lean/ (ATTRIBUTION.md); built in their own .lake dirs.
[[require]]
name = "lean-riscv"
path = "riscv-lean/lean_emulator"

# The machine layer copied from ship-your-lua (itself ship-your-interpreter's),
# module names kept so its proofs and generators apply unchanged: the import
# closure of the segment layer (experiments/port/copied.txt).
[[lean_lib]]
name = "Vsa"
globs = ["Vsa.+"]
leanOptions.backward.isDefEq.respectTransparency = false

# The tcc image's boot interface and per-program captured cuts.
[[lean_lib]]
name = "TccMachine"
globs = ["Tcc.Boot.+", "Tcc.Capture.+", "Tcc.Prog.Sum.Machine.+", "Tcc.EndToEnd.+", "Tcc.Printf.+",
  "Tcc.Ccp.Eval", "Tcc.Ccp.Lemmas", "Tcc.Ccp.KernelRfl", "Tcc.Ccp.Sound"]

# The CompileCut pilot's generated run of tcc's compile phase on the evaluator
# (scripts/gen_ccp.py): code table, reset memory, 267 checkpoint states and 266
# kernel-checked 25,000-step segments, joined in Tcc.Ccp.Sum.run_all. Not a
# default target (about 3 CPU-hours; build the segments one at a time, each
# needs ~7 GB: results/p3/compile-cut-pilot.md).
[[lean_lib]]
name = "TccCompileCut"
globs = ["Tcc.Ccp.Sum.+", "Tcc.Ccp.SumCut", "Tcc.Ccp.EndToEnd"]
# --- end machine lane ---------------------------------------------------------

# --- CSem: our fork of cerberus-lean (DESIGN-COMPILER.md §2, phase F0) --------
# csem/ is OathTech/cerberus-lean at vendor/CSEM_REV plus our commits
# (csem/PORT-4.34.md). The libraries below are the fork's own
# (csem/lean_frontend/lakefile.toml, kept for reference), ported to this
# project's Lean 4.34.0. None is a default target: `scripts/check.sh --csem`
# builds and gates them (results/csem/f0-validation.md has the cost).

# LemLib, the Lem runtime for Lean (lem-lean lean-lib/ at vendor/CSEM_REV),
# vendored in csem/lemlib.
[[lean_lib]]
name = "LemLib"
srcDir = "csem/lemlib"
globs = ["LemLib", "LemLib.+"]

[[lean_lib]]
name = "LemLibTests"
srcDir = "csem/lemlib"
roots = ["LemLibTest", "LemLibTheorems", "LemLibPmapLaws"]

# The fork's native digest support (csem/lean_frontend/native/md5.c) as a Lake
# extern_lib; a path package because lakefile.toml cannot declare one.
[[require]]
name = "CSemNative"
path = "csem/native-lake"

